# Fly.io deploy config. `fly launch --no-deploy` then edit, or use as-is:
#   fly volumes create maildata --size 1
#   fly secrets set AUTH_SECRET=... MASTER_KEY=...   (see SETUP.md)
#   fly deploy
app = "robski-mail"
primary_region = "cdg"   # Paris - close to Lisbon

[build]

[env]
  DATA_DIR = "/data"
  ALLOW_ORIGIN = "https://life.robski.uk"

[[mounts]]
  source = "maildata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # sleep when idle to save money; wakes on request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
