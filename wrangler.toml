name = "today-robski"
main = "worker/index.js"
compatibility_date = "2026-05-07"

# One deploy serves both the page and the API. Static files win by path, and
# anything without a matching file (ie /api/*) falls through to the worker.
[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first so it can serve a different app at the root per hostname
# (Life at life.robski.uk, Today elsewhere). Non-API paths fall straight through
# to env.ASSETS, so static files are still served normally.
run_worker_first = true
# Serve .html files directly. Without this the binding 307-redirects /index.html
# -> / (clean URLs), which loops when the Worker fetches it for the root.
html_handling = "none"

[[routes]]
pattern = "today.robski.uk"
custom_domain = true

# The Robski Life app's own front door. Same worker + D1; the root redirects
# this hostname to /app.html (see the inline script in index.html).
[[routes]]
pattern = "life.robski.uk"
custom_domain = true

[vars]
GOOGLE_CALENDAR_ID = "robin@lumley-savile.com"

# Who can be sent a sign-in code. Anything else gets the same "ok" response,
# so the list can't be probed from outside.
#
# `*@domain` allows any mailbox on that domain. It's exactly as safe as the
# domain itself: the code goes to the address typed, so signing in still means
# reading that inbox. Only put a domain here whose mail you receive.
ADMIN_EMAILS = "robin@lumley-savile.com,robin@incremento.co,*@robski.uk,*@robinsavile.com"

# Resend, same as Career Club and the Incremento admin.
#
# incremento.co because it is the one domain verified on the free tier, and a
# verified domain can send to any address. The sender domain is incidental:
# Career Club posts its codes from onboarding@resend.dev and carries its brand
# in the body, which is what this does. Verifying robski.uk would cost $20/mo;
# Cloudflare's free path would mean editing the SPF record that robski.uk's
# real Purelymail inbox depends on.
#
# onboarding@resend.dev would not work here: it only delivers to the Resend
# account's own address, and codes go to robin@lumley-savile.com.
FROM_EMAIL = "Robski Today <today@incremento.co>"

# Where the 08:45 morning brief lands. One address, not the ADMIN_EMAILS list:
# that list is who may sign in, which is a different question from who gets
# post every morning.
BRIEF_EMAIL = "robin@lumley-savile.com"

# Every minute, so a block starting in 5 gets a text 5 minutes out. The handler
# only sends inside a 4-6 minute window and marks each block once, so a minute
# of ticks with nothing due is a no-op D1 read.
#
# MUST stay its own table, below the whole [vars] block. Slot it between two
# [vars] keys and TOML folds every key beneath it into [triggers] - which is
# how ADMIN_EMAILS once went missing and silently broke sign-in.
[triggers]
crons = ["* * * * *"]

# ── Staging: the Daybook multi-tenant build ───────────────────────────
# A SEPARATE Worker (daybook-staging.<subdomain>.workers.dev) on its OWN D1 and
# R2 bucket, so the multi-tenant rewrite can't touch the live daily-driver.
#   Deploy:  npm run deploy:staging   (npx wrangler deploy --env staging)
#   Schema:  npm run db:staging       (applies worker/schema.sql to the staging DB)
# Deliberately NO [env.staging.triggers]: staging must never run the every-minute
# cron, or it would double-send Robin's SMS alerts, morning brief and mail pushes.
# Secrets are per-environment and must be set by Robin, e.g.
#   npx wrangler secret put AUTH_SECRET --env staging
# (see the list at the bottom of this file; without them staging can't sign in).
[env.staging]
name = "daybook-staging"
workers_dev = true
# CRITICAL: named envs inherit the top-level [[routes]] and [triggers] unless
# they set their own. Without these two overrides, `deploy --env staging` would
# reattach today.robski.uk / life.robski.uk to the STAGING worker (pointing the
# live domains at the empty staging DB) and try to claim a cron. Keep them empty:
# staging lives ONLY at daybook-staging.<subdomain>.workers.dev, with no cron.
routes = []

[env.staging.triggers]
crons = []

[env.staging.vars]
GOOGLE_CALENDAR_ID = "robin@lumley-savile.com"
# Only Robin to start; invite-only test users get added here (or, once the users
# table drives access, this list stops being the gate).
ADMIN_EMAILS = "robin@lumley-savile.com,robin@incremento.co,*@robski.uk,*@robinsavile.com"
FROM_EMAIL = "Robski Today <today@incremento.co>"
BRIEF_EMAIL = "robin@lumley-savile.com"

# Both DB and PORTFOLIO_DB point at the one staging database: on staging the
# portfolio is just more tenant-scoped tables, not the shared live portfolio DB.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "daybook-staging"
database_id = "b7f2b6c9-ee72-44df-a493-73bb7b6a1ad5"

[[env.staging.d1_databases]]
binding = "PORTFOLIO_DB"
database_name = "daybook-staging"
database_id = "b7f2b6c9-ee72-44df-a493-73bb7b6a1ad5"

[[env.staging.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "daybook-staging-attachments"

# ── D1 ────────────────────────────────────────────────────────────────
# Created in WEUR. Schema: npx wrangler d1 execute today-robski --file worker/schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "today-robski"
database_id = "22cfad75-5c6f-463c-9dfc-fb96c9257ee8"

# Portfolio holdings + snapshot history. This is the SAME database that
# portfolio.robski.uk uses - bound here so Robski Life reads/writes the very
# same data (no migration), and both surfaces stay in sync during the move.
[[d1_databases]]
binding = "PORTFOLIO_DB"
database_name = "portfolio-tracker"
database_id = "0360e843-4b3c-4d98-beb6-4d185fb12cbc"

# ── R2 ────────────────────────────────────────────────────────────────
# Note/task/row file attachments. Bytes live here; the per-block list is in
# props.attachments. ENABLE: turn on R2 in the dashboard, then
#   npx wrangler r2 bucket create life-attachments
# The attach button returns a friendly 501 whenever this binding is absent
# (handleAttachments guards on env.ATTACHMENTS).
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "life-attachments"

# ── Secrets (npx wrangler secret put <NAME>) ──────────────────────────
#   AUTH_SECRET           signs the 7-day session JWTs. Rotating it signs
#                         everyone out, which is the panic button.
#   RESEND_API_KEY        sends the sign-in codes. Same key as the other admins.
#   SYNC_KEY              Mac sync agent -> API.
#   GOOGLE_CLIENT_ID      OAuth client, see README.
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN  from `npm run google-auth`
#   GATEWAYAPI_KEY        sends the 5-min block alerts. Same GatewayAPI account
#                         as the LST admin (routes/sms.js). Alerts are simply
#                         off until this is set.
#   ALERT_PHONE           where the alerts go: Robin's mobile, full international
#                         (+351...). Also off until set.
#   ALERT_SENDER          optional sender id, defaults to "Robski". A number
#                         here (eg +351920111939) if a network drops letters.
