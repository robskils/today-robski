<!-- Analytics (VisitorTracking + Google Analytics), loaded ONLY after consent -->
<style>
.dbk-consent { position:fixed; left:0; right:0; bottom:0; z-index:99999; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px 22px; padding:16px 20px; background:var(--card,#fffdf8); border-top:1px solid var(--line,rgba(27,24,32,.12)); box-shadow:0 -10px 34px -20px rgba(0,0,0,.55); color:var(--ink,#1b1820); }
.dbk-consent p { margin:0; max-width:620px; font-size:15.5px; line-height:1.5; }
.dbk-consent a { color:var(--rust,#c4412e); font-weight:600; text-decoration:none; }
.dbk-consent .dbk-btns { display:flex; gap:10px; flex:none; }
.dbk-consent button { font:inherit; font-size:15px; font-weight:600; padding:10px 22px; border-radius:10px; cursor:pointer; border:1px solid var(--line-2,rgba(27,24,32,.2)); }
.dbk-consent .dbk-accept { background:var(--rust,#c4412e); color:var(--rust-ink,#fff); border-color:var(--rust,#c4412e); }
.dbk-consent .dbk-decline { background:transparent; color:var(--ink-2,rgba(27,24,32,.66)); }
@media (max-width:560px){ .dbk-consent .dbk-btns { flex:1 1 100%; } .dbk-consent button { flex:1; } }
</style>
<script>
(function () {
  var KEY = 'daybook.consent';
  function loadTrackers() {
    try {
      window.init_tracer = function () { try { new Tracer({ websiteId: "b4a0a73f-caf4-44ef-a318-8b9933bd3350", async: true, debug: false }); } catch (e) {} };
      var vt = document.createElement('script'); vt.async = true; vt.defer = true; vt.src = 'https://app.visitortracking.com/assets/js/tracer.js'; document.head.appendChild(vt);
      window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); }; gtag('js', new Date()); gtag('config', 'G-2QJM3NGDX7');
      var ga = document.createElement('script'); ga.async = true; ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-2QJM3NGDX7'; document.head.appendChild(ga);
    } catch (e) {}
  }
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function banner() {
    if (document.querySelector('.dbk-consent')) return;
    var b = document.createElement('div'); b.className = 'dbk-consent'; b.setAttribute('role', 'dialog'); b.setAttribute('aria-label', 'Cookie choices');
    b.innerHTML = '<p>LifeFold uses analytics cookies to understand how the site is used - nothing personal, and never any of your LifeFold content. May we? <a href="/privacy">Privacy</a></p><div class="dbk-btns"><button class="dbk-decline" type="button">Decline</button><button class="dbk-accept" type="button">Accept</button></div>';
    b.querySelector('.dbk-accept').addEventListener('click', function () { set('granted'); b.remove(); loadTrackers(); });
    b.querySelector('.dbk-decline').addEventListener('click', function () { set('denied'); b.remove(); });
    document.body.appendChild(b);
  }
  document.addEventListener('click', function (e) { var t = e.target.closest && e.target.closest('[data-cookie-settings]'); if (t) { e.preventDefault(); banner(); } });
  var d = get();
  if (d === 'granted') { loadTrackers(); }
  else if (d !== 'denied') { if (document.readyState !== 'loading') banner(); else document.addEventListener('DOMContentLoaded', banner); }
})();
</script>
