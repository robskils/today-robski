<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robski · Life · Notes</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/life.css?v=20260830zl">
<script>
  try {
    const t = localStorage.getItem('today.theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
  location.replace('/app');
</script>
</head>
<body>
  <header class="bar">
    <div class="bar-l">
      <span class="mark">Robski<span class="dot">·</span><em>Life</em></span>
      <nav class="tabs">
        <a class="tab" href="/life.html">Tasks</a>
        <a class="tab" href="/tables.html">Tables</a>
        <a class="tab on" href="/notes.html">Notes</a>
      </nav>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search everything…" aria-label="Search" autocomplete="off"></div>
    <div class="bar-r">
      <a class="ghost" href="/" title="Your day">Today →</a>
      <button class="ghost icon" id="theme" title="Light / dark" aria-label="Toggle theme">◑</button>
      <a class="ghost" id="export" href="/api/export" title="Download a full backup">Backup</a>
    </div>
  </header>

  <main class="notes-grid">
    <aside class="notes-side">
      <h2 class="col-h">Notes</h2>
      <div id="tops" class="notes-tops"></div>
      <button class="add-btn wide" id="new-top" style="margin-top:12px">+ New note</button>
    </aside>
    <section class="notes-main" id="main"></section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/notes.js"></script>
</body>
</html>
