<!doctype html>
<!-- en-GB so the browser's native date-input picker starts the week on Monday
     (and uses dd/mm) rather than the US Sunday-first default. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Don't let the mobile OS auto-detect phone numbers, emails and addresses in
     note content and turn them into tappable links: a note full of booking
     details would otherwise open the Phone/Mail app when a finger brushes one
     while scrolling. The app linkifies real http(s) URLs itself. -->
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Kaya</title>
<link rel="icon" href="/favicon.svg?v=202611121242">
<!-- Installable to the home screen: launches full-screen with its own icon. -->
<link rel="manifest" href="/manifest.webmanifest?v=202611121242">
<link rel="apple-touch-icon" href="/apple-touch-icon.v23.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaya">
<meta name="theme-color" content="#2A333F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<!-- Fonts are self-hosted via koyeba.css (@font-face): Cormorant Garamond + Jost only. No Google Fonts link. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/CormorantGaramond-500.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/CormorantGaramond-300.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/CormorantGaramond-300-italic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/Jost-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/Jost-500.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/Jost-600.woff2" crossorigin>
<link rel="stylesheet" href="/koyeba.css?v=202611121242">
<link rel="stylesheet" href="/life.css?v=202611121242">
<link rel="stylesheet" href="/daylight.css?v=202611121242">
<script>
  try {
    // The light and the theme always travel together: see applyLight() in app.js.
    const l = localStorage.getItem('today.light');
    document.documentElement.dataset.light = ['dawn', 'overcast', 'dusk', 'night'].includes(l) ? l : 'overcast';
    document.documentElement.dataset.theme = 'dark';
    // Plain mode: a calm ivory page with no wash. Set it here too, so a plain-mode
    // user never sees the painted wash flash before applyTheme runs. (Robin, 2026-11-06.)
    const plain = localStorage.getItem('life.plain') === '1';
    if (plain) document.documentElement.setAttribute('data-plain', '');
    // The sky paints with the first frame; the app stays hidden until it has content,
    // then fades in once. A timer guarantees it can never stay hidden.
    (function () {
      var r = document.documentElement;
      if (plain) { r.style.background = '#F6F2E9'; }
      else {
        var w = '/wash/' + r.dataset.light + '.webp?v=202611121242';
        r.style.background = 'url(' + w + ') top / cover no-repeat fixed';
        var pl = document.createElement('link'); pl.rel = 'preload'; pl.as = 'image'; pl.href = w; document.head.appendChild(pl);
      }
      r.classList.add('booting');
      var n = 0, t = setInterval(function () {
        if (document.querySelector('#pane > *') || document.querySelector('.gate2') || ++n > 80) {
          clearInterval(t); r.classList.add('reveal');
          requestAnimationFrame(function () { r.classList.remove('booting'); setTimeout(function () { r.classList.remove('reveal'); }, 400); });
        }
      }, 50);
    })();
    // Custom accent colour, applied before first paint so there's no red flash.
    const ac = localStorage.getItem('life.accent');
    if (ac && /^#?[0-9a-fA-F]{3,6}$/.test(ac)) {
      const h = ac[0] === '#' ? ac : '#' + ac;
      const x = h.replace('#', ''); const n = x.length === 3 ? x.split('').map((c) => c + c).join('') : x;
      const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
      document.documentElement.style.setProperty('--accent', h);
      document.documentElement.style.setProperty('--accent-ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#12100b' : '#fff');
    }
  } catch (e) {}
  // Own the scroll position: stop the browser from restoring where you were on a
  // reopen, so a cold open can land on the top of Today (Robin, 2026-11-03: mobile
  // kept dropping me part-way down). Set before the load's scroll-restore runs.
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  // No redirect here: if there's no token, app.js shows a sign-in gate in place
  // (the root of life.robski.uk is this app, so a redirect would loop).
</script>
</head>
<body>
  <div class="app-shell">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <div class="tabstrip" id="tabstrip"></div>
      <div class="pane" id="pane"></div>
      <footer class="app-foot" id="app-foot"></footer>
    </main>
  </div>
  <button class="undo-fab" id="undo-fab" data-undo type="button" aria-label="Undo the last change" title="Undo"><span class="uf-ic" aria-hidden="true">↶</span><span class="uf-l">Undo</span></button>
  <div id="palette"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/qrcode.min.js?v=202611121242"></script>
  <script src="/app.js?v=202611121242"></script>
  <script src="/guide.js?v=202611121242"></script>
</body>
</html>
