<!doctype html>
<!-- en-GB so the browser's native date-input picker starts the week on Monday
     (and uses dd/mm) rather than the US Sunday-first default. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robski Daybook</title>
<link rel="icon" href="/favicon.svg">
<!-- Installable to the home screen: launches full-screen with its own icon. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131019" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/life.css?v=20260825c">
<script>
  try {
    const t = localStorage.getItem('today.theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
  // No redirect here: if there's no token, app.js shows a sign-in gate in place
  // (the root of life.robski.uk is this app, so a redirect would loop).
</script>
</head>
<body>
  <div class="app-shell">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <div class="tabstrip" id="tabstrip"></div>
      <div class="pane" id="pane"></div>
    </main>
  </div>
  <div id="palette"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=20260825c"></script>
</body>
</html>
