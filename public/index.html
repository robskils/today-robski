<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // life.robski.uk is the Robski Life app; today.robski.uk is the day planner.
  // Same worker + assets, split by hostname at the door - before anything paints.
  // The worker serves the Life app at the life.robski.uk root, so if this page
  // (index.html) ever loads there - eg /index.html directly - bounce to the root.
  if (location.hostname === 'life.robski.uk') location.replace('/');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<title>Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  // Resolve the theme before first paint. Without this the page flashes light
  // then corrects, and the CSS would need a prefers-color-scheme copy of every
  // token to drift out of sync with the real ones.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('today.theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="/today.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>

<!-- Email sign-in. Code by email, then a 7-day session token in localStorage. -->
<div id="gate" class="gate" hidden>
  <!-- The door is Robski. The room, once you're in, is not. -->
  <div class="gate-card">
    <img class="gate-mark" src="/robski.jpg" alt="Robski" width="760" height="190">
    <div class="gate-stripe" aria-hidden="true"></div>

    <div class="gate-body">
      <h1 class="gate-title">Today</h1>

      <form id="gate-email-form">
      <p class="gate-sub">Sign in with your email.</p>
      <input type="email" id="gate-email" class="input" placeholder="you@example.com"
             autocomplete="email" inputmode="email" required>
      <button class="btn btn-primary" type="submit" id="gate-send">Send me a code</button>
    </form>

      <form id="gate-code-form" hidden>
        <p class="gate-sub">Code sent to <span id="gate-sent-to"></span>. It expires in 10 minutes.</p>
        <input type="text" id="gate-code" class="input code-input" placeholder="000000"
               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <button class="btn btn-primary" type="submit" id="gate-verify">Sign in</button>
        <button class="btn btn-ghost" type="button" id="gate-back">Use another email</button>
      </form>

      <p class="gate-err" id="gate-err" hidden></p>
    </div>
  </div>
</div>

<div id="app" hidden>

  <header class="bar">
    <div class="bar-left">
      <!-- On-brand wordmark, matching Life · Robski. -->
      <a class="wordmark" href="/" title="Today · Robski"><em>Today</em><span class="dot">·</span>Robski</a>
      <div class="bar-date">
        <button class="nav-btn" id="prev-day" aria-label="Previous day">&#8249;</button>
        <div class="bar-title">
          <h1 id="day-title">Today</h1>
          <p id="day-sub"></p>
        </div>
        <button class="nav-btn" id="next-day" aria-label="Next day">&#8250;</button>
      </div>
    </div>
    <div class="bar-actions">
      <button class="ghost-btn" id="today-btn" hidden>Today</button>
      <a class="ghost-btn nav-link" href="https://life.robski.uk" title="Tasks, notes, tables and areas">Life &rarr;</a>
      <span class="sync" id="sync-status" title="Tana only syncs while your Mac is awake"></span>
      <button class="ghost-btn" id="theme-btn" aria-label="Toggle theme">&#9789;</button>
    </div>
  </header>

  <!-- 只管打坐 shikantaza, "just sitting". Same watermark as the dojo site.
       Decorative: hidden from screen readers, ignores the pointer. -->
  <div class="kanji-watermark" aria-hidden="true">只管打坐</div>

  <!-- The lanes. This is the whole point of the tool: a glance tells you
       which part of your life you've been starving. -->
  <section class="rail" id="rail" aria-label="Lane progress"></section>

  <main class="grid">
    <!-- The repeating practices. Unlike a task, an activity is never used up:
         drag it onto the schedule as often as the day wants. -->
    <aside class="col-acts">
      <div class="col-head">
        <h2>Practices</h2>
      </div>
      <div id="acts-panel"></div>
    </aside>

    <section class="col-day">
      <div class="col-head">
        <h2>Schedule</h2>
        <div class="col-head-actions">
          <button class="ghost-btn" id="add-event">+ Event</button>
          <button class="ghost-btn" id="add-block">+ Block</button>
        </div>
      </div>
      <!-- Intentions for today with no clock against them yet. -->
      <div class="tray" id="tray" hidden>
        <div class="tray-head">
          <span id="tray-label">Any time today</span>
        </div>
        <div class="tray-items" id="tray-items"></div>
      </div>

      <div class="timeline-wrap">
        <div class="timeline" id="timeline"></div>
      </div>

      <!-- What the day actually held. A record, not a scoreboard. -->
      <section class="tally" id="tally" aria-label="What today held" hidden></section>

      <!-- One teaching for the day. Same on every device, all day. -->
      <figure class="quote" id="quote" hidden>
        <blockquote id="quote-text"></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>
    </section>

    <aside class="col-tasks">
      <div class="col-head">
        <h2>Tasks <span class="count" id="task-count"></span></h2>
        <button class="ghost-btn" id="new-task">+ New</button>
      </div>
      <input type="search" id="task-search" class="input input-sm" placeholder="Search tasks">
      <div class="chips" id="lane-filter"></div>
      <div class="task-list" id="task-list"></div>
    </aside>
  </main>
</div>

<!-- Slot editor. Doubles as create + edit. -->
<div class="sheet-bg" id="sheet-bg" hidden>
  <form class="sheet" id="sheet">
    <h3 id="sheet-title">Add to today</h3>
    <!-- The name, editable. Renaming a task writes back to Tana; renaming a bare
         block just changes its own label. -->
    <input type="text" class="input sheet-name" id="sheet-name" hidden
           aria-label="Name" autocomplete="off">
    <p class="sheet-task" id="sheet-task" hidden></p>

    <!-- Every task in this block. The block's inline view only shows what fits;
         this is the full list, where they can be ticked or taken out. -->
    <div class="sheet-tasks" id="sheet-tasks" hidden>
      <span class="sheet-tasks-label" id="sheet-tasks-label"></span>
      <div class="sheet-tasks-list" id="sheet-tasks-list"></div>
    </div>

    <label class="field" id="sheet-lane-field">
      <span>Lane</span>
      <select id="sheet-lane" class="input"></select>
      <span class="zen-note" id="sheet-zen" hidden></span>
    </label>

    <div class="field-row">
      <label class="field" id="sheet-start-field">
        <span>Start</span>
        <input type="time" id="sheet-start" class="input" step="300">
      </label>
      <label class="field">
        <span>Minutes</span>
        <input type="number" id="sheet-duration" class="input" min="5" max="720" step="5" required>
      </label>
    </div>

    <label class="toggle" id="sheet-float-row">
      <input type="checkbox" id="sheet-float">
      <span>Any time today - decide later</span>
    </label>

    <div class="quick" id="sheet-quick"></div>

    <!-- For when the work is going well and the block can wait. -->
    <div class="quick push" id="sheet-push" hidden>
      <span class="push-label">Push</span>
      <button type="button" data-push="15">15m</button>
      <button type="button" data-push="30">30m</button>
      <button type="button" data-push="60">1h</button>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="sheet-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="sheet-delete" hidden>Delete</button>
      <button type="submit" class="btn btn-primary" id="sheet-save">Add</button>
    </div>
  </form>
</div>

<!-- New task. Goes straight into the Tana Inbox via the Input API. -->
<div class="sheet-bg" id="new-bg" hidden>
  <form class="sheet" id="new-form">
    <h3>New task</h3>
    <p class="sheet-sub">Lands in your Tana Inbox, tagged #Task.</p>

    <label class="field">
      <span>Task</span>
      <input type="text" id="new-title" class="input" placeholder="What needs doing" required>
    </label>

    <label class="field">
      <span>Area</span>
      <select id="new-area" class="input"></select>
    </label>

    <div class="field-row">
      <label class="field">
        <span>Priority</span>
        <select id="new-priority" class="input"></select>
      </label>
      <label class="field">
        <span>Minutes</span>
        <input type="number" id="new-duration" class="input" min="5" max="720" step="5" placeholder="optional">
      </label>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="new-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="new-save">Add to Tana</button>
    </div>
  </form>
</div>

<!-- A real Google Calendar event, not a block. Blocks are this app's own; an
     event is a commitment other people can see. -->
<div class="sheet-bg" id="ev-bg" hidden>
  <form class="sheet" id="ev-form">
    <h3>New event</h3>
    <p class="sheet-sub">Goes straight into your Google Calendar.</p>

    <label class="field">
      <span>Event</span>
      <input type="text" id="ev-title" class="input" placeholder="What's happening" required>
    </label>

    <div class="field-row">
      <label class="field">
        <span>Start</span>
        <input type="time" id="ev-start" class="input" step="300" required>
      </label>
      <label class="field">
        <span>Minutes</span>
        <input type="number" id="ev-duration" class="input" min="5" max="1440" step="5" value="60" required>
      </label>
    </div>

    <div class="quick" id="ev-quick"></div>

    <label class="field">
      <span>Where <span class="field-opt">optional</span></span>
      <input type="text" id="ev-location" class="input" placeholder="Address or link">
    </label>

    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="ev-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="ev-save">Add to Calendar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/today.js"></script>
</body>
</html>
